[project]
name = "docker-fava"
version = "0.0.0"
description = "The python packages of the tarioch/fava Docker image"
classifiers = [
    "Private :: Do Not Upload"
]
requires-python = ">=3.14"
dependencies = [
    "beancount-reds-plugins",
    "beanprice",
    "fava",
    "fava-dashboards",
    "smart-importer",
    "tariochbctools",
]

[tool.uv]
# only the dependencies are installed, this is not a package
package = false
